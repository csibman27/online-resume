profile:
  show: true
  order: 1
  title: Profile
  description: |
  
    Technical Officer and Infrastructure Engineer with 6+ years at a leading Irish research institute, specialising in the design, deployment, and administration of complex, high-performance computing environments and cutting-edge quantum infrastructure.
    My hands-on experience spans the full data center stack, from physical infrastructure including UPS systems, diesel generators and chiller cooling systems, through to virtualisation (Openstack, VMware ESXi, Proxmox), SAN storage, and enterprise networking with Cisco and Arista switching platforms.
    On the quantum side, I manage and configure quantum cryptographic equipment including quantum IP encryptors, Quantum Random Number Generators (QRNGs), and Quantum Hardware Security Modules (HSMs),  a rare and highly specialised skillset with very few practitioners globally.
    I take a DevOps approach to infrastructure management, using Ansible to automate the deployment and configuration of critical infrastructure services including DNS, DHCP, Checkmk, Nagios, LISTSERV, and many others. I also administer OpenShift and OpenStack platforms, bridging traditional infrastructure with modern cloud-native environments.
    Monitoring and reliability are core to my work, with hands-on experience across Checkmk and Nagios for system observability across large-scale environments.
    Academically, I hold a BSc in Information Technology and an HDip in Computer Science, I am currently completing a Master's degree in Computer Science, and hold a Red Hat Certified System Administrator (RHCSA) certification. I am also expanding into IBM mainframe technologies as part of my ongoing professional development.
    Open to senior infrastructure, DevOps, data centre, network engineering, and quantum technology roles across Ireland, Europe, and remote.
   
