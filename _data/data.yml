project:
  show: true
  order: 3
  title: Projects
  description: |


  items:
    - name: Redundant DHCP Infrastructure, Arclabs
      date: 2025
      description: |
        Designed and deployed a fully redundant DHCP infrastructure for Arclabs, 
        automating the entire deployment and configuration using Ansible to ensure 
        consistency, reliability, and rapid recovery in case of failure.
        + Proxmox, Ansible, DHCP

    - name: Infrastructure Lifecycle Manager
      date: 2024
      description: |
        Built a full-stack web application to replace manual tracking of server and 
        network device inventory. Enables lifecycle planning, hardware age tracking, 
        and data center refresh cycle management, the first structured system of 
        its kind at the institute.
        + JavaScript, Node.js, Handlebars, MongoDB

    - name: Quantum Encryptor Monitoring, Thales IP Encryptors
      date: 2023
      description: |
        Developed a real-time monitoring solution for quantum Thales IP encryptors, 
        providing visibility into cryptographic hardware health and operational status.
        + Python, MQTT, InfluxDB, Grafana

    - name: Eddy Covariance Research Tower
      date: 2021 - 2022
      description: |
         Physically assembled and deployed a scientific Eddy Covariance environmental 
         monitoring tower from component parts, and designed and built the complete IT 
         networking infrastructure for the installation at an outdoor field location. 
         The tower captures atmospheric and soil data including humidity, radiation, and 
         soil sensors supporting active environmental research.
         + Hardware Assembly, Network Design, Data Logging, Field Deployment

    - name: Mailman3 LISTSERV Deployment
      date: 2021
      description: |
        Deployed and fully automated a Mailman3 mailing list server supporting 
        over 100 mailing lists and 100+ users across the institute. Automated 
        the entire deployment pipeline using Ansible for repeatable and 
        consistent configuration management.
        + Ansible, Mailman3, Linux

